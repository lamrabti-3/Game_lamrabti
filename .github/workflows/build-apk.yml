name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          ls -la www/

      - name: Init npm
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Capacitor init
        run: npx cap init "Block Arena" com.blockarena.app --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Sync web
        run: npx cap sync android

      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Fix gradle wrapper permissions
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "no debug dir"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockArena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
