name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          ls -la www/

      - name: Create package.json
        run: |
          cat > package.json << 'PKGEOF'
          {
            "name": "block-arena",
            "version": "1.0.0",
            "description": "Block Arena FPS",
            "private": true
          }
          PKGEOF
          cat package.json

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'CFGEOF'
          {
            "appId": "com.blockarena.app",
            "appName": "Block Arena",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          CFGEOF
          cat capacitor.config.json

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web to android
        run: npx cap sync android

      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Fix gradle permissions
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "no apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockArena-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
